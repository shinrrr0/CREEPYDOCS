{# index.html - feed of stories. #}
{% extends 'base.html' %}

{% block title %}CreepyDocs — архив{% endblock %}

{% block content %}
  <div class="feed">
    {% if stories %}
      {% for story in stories %}
        {% include 'components/content_block.html' %}
      {% endfor %}
    {% else %}
      <p class="feed__empty">— здесь ещё ничего нет —</p>
    {% endif %}
  </div>
{% endblock %}
